<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Roundtable: mic + Web Speech coexistence test</title>
<style>
  body { font: 16px system-ui, sans-serif; margin: 0; padding: 16px; background: #0b0d12; color: #e8eaf0; }
  button { font: inherit; padding: 14px 20px; border-radius: 12px; border: 0; background: #6d5efc; color: #fff; min-height: 48px; }
  .bar { height: 18px; background: #1b1f2a; border-radius: 9px; overflow: hidden; margin: 10px 0; }
  .bar > div { height: 100%; width: 0; background: #3ddc97; transition: width 40ms linear; }
  .bar.vad > div { background: #ffb020; }
  pre { background: #121620; padding: 10px; border-radius: 10px; white-space: pre-wrap; font-size: 13px; }
  #verdict { font-weight: 700; padding: 10px; border-radius: 10px; margin: 10px 0; background: #1b1f2a; }
  .ok { color: #3ddc97; } .bad { color: #ff5d6c; }
</style>
</head>
<body>
<h3>Mic levels + Web Speech, together</h3>
<p>Open on each target phone over HTTPS. Tap Start, speak for ~10 s, stay quiet for ~5 s.</p>
<button id="go">Start</button>
<div id="verdict">idle</div>
<div class="bar" id="bar"><div></div></div>
<pre id="stats"></pre>
<pre id="asr"></pre>
<pre id="settings"></pre>
<script>
const $ = (id) => document.getElementById(id);
let silentFrames = 0, frames = 0, lastDb = -100, maxDb = -100, floor = -100, vad = 0;
let asrEvents = 0, asrFinal = 0, asrErr = [];

$('go').onclick = async () => {
  $('go').disabled = true;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 },
    });
    $('settings').textContent = 'track settings: ' + JSON.stringify(stream.getAudioTracks()[0].getSettings(), null, 1);

    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    await ctx.audioWorklet.addModule('/worklet/level-processor.js');
    const node = new AudioWorkletNode(ctx, 'level-processor', { numberOfInputs: 1, numberOfOutputs: 1, channelCount: 1 });
    const mute = ctx.createGain(); mute.gain.value = 0;
    ctx.createMediaStreamSource(stream).connect(node).connect(mute).connect(ctx.destination);
    node.port.onmessage = (e) => {
      const m = e.data; if (m.type !== 'lvl') return;
      frames++; lastDb = m.db; floor = m.floor; vad = m.vad; maxDb = Math.max(maxDb, m.db);
      silentFrames = m.db <= -99 ? silentFrames + 1 : 0;
    };

    // Now start Web Speech while the mic is already open (this is the case we need to test)
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { $('verdict').innerHTML = '<span class="bad">No Web Speech API here: use PCM fallback</span>'; }
    else {
      const rec = new SR(); rec.continuous = true; rec.interimResults = true; rec.lang = 'en-US';
      rec.onresult = (e) => {
        asrEvents++;
        const r = e.results[e.results.length - 1];
        if (r.isFinal) asrFinal++;
        $('asr').textContent = (r.isFinal ? '[final] ' : '[partial] ') + r[0].transcript;
      };
      rec.onerror = (e) => asrErr.push(e.error);
      rec.onend = () => { try { rec.start(); } catch (_) {} };
      rec.start();
    }

    setInterval(() => {
      $('bar').className = 'bar' + (vad ? ' vad' : '');
      $('bar').firstElementChild.style.width = Math.max(0, Math.min(100, (lastDb + 80) * 100 / 80)) + '%';
      $('stats').textContent =
        `frames: ${frames}\ndb: ${lastDb.toFixed(1)}  floor: ${floor.toFixed(1)}  max: ${maxDb.toFixed(1)}  vad: ${vad}\n` +
        `asr events: ${asrEvents} (final ${asrFinal})  asr errors: ${asrErr.join(',') || 'none'}`;
      const stolen = silentFrames >= 150;
      const meterOk = frames > 50 && !stolen && maxDb > -80;
      const asrOk = asrEvents > 0;
      $('verdict').innerHTML = stolen
        ? '<span class="bad">FAIL: mic went silent once Web Speech started. Use PCM fallback on this phone.</span>'
        : (meterOk && asrOk ? '<span class="ok">PASS: levels and Web Speech coexist.</span>'
          : 'running... speak now (levels ' + (meterOk ? 'ok' : 'waiting') + ', asr ' + (asrOk ? 'ok' : 'waiting') + ')');
    }, 100);
  } catch (e) {
    $('verdict').innerHTML = '<span class="bad">' + (e.name || 'Error') + ': ' + (e.message || e) + '</span>';
    $('go').disabled = false;
  }
};
</script>
</body>
</html>
